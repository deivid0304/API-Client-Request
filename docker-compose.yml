services:
  postgres:
    image: postgres:16-alpine
    container_name: api-cliente-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-api_cliente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_cliente_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-api_cliente}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api_cliente} -d ${POSTGRES_DB:-api_cliente}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
